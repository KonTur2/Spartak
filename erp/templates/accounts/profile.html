<!-- templates/accounts/profile.html -->
{% extends 'base.html' %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <div class="card">
            <div class="card-header bg-info text-white">
                <h4 class="mb-0"><i class="bi bi-person"></i> Профиль пользователя</h4>
            </div>
            <div class="card-body">
                <div class="text-center mb-4">
                    <i class="bi bi-person-circle" style="font-size: 5rem;"></i>
                    <h3>{{ user.username }}</h3>
                    <span class="badge bg-primary">{{ user_role }}</span>
                </div>
                
                <table class="table">
                    <tr>
                        <th><i class="bi bi-envelope"></i> Email:</th>
                        <td>{{ user.email }}</td>
                    </tr>
                    <tr>
                        <th><i class="bi bi-calendar"></i> Дата регистрации:</th>
                        <td>{{ user.date_joined|date:"d.m.Y H:i" }}</td>
                    </tr>
                    <tr>
                        <th><i class="bi bi-clock"></i> Последний вход:</th>
                        <td>{{ user.last_login|date:"d.m.Y H:i" }}</td>
                    </tr>
                </table>
            </div>
        </div>
    </div>
</div>
{% endblock %}
